<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thema bearbeiten</title>
</head>
<body>
<h1>Bearbeite folgendes Thema</h1>
<form method="post" th:action="@{/admin/themen/{id}/bearbeiten(id=${thema.id})}">
    <label>Titel</label>
    <input type="text" name="titel" th:value ="${thema.titel}" required>
    <label>Cluster</label>
    <input type="text" name="cluster" th:value ="${thema.cluster}">
    <label>Beschreibung</label>
    <textarea name="beschreibung" th:text ="${thema.beschreibung}" required></textarea>
    <label>Chancen</label>
    <textarea name="chancen" th:text ="${thema.chancen}" required></textarea>
    <label>Risiken</label>
    <textarea name="risiken" th:text ="${thema.risiken}" required></textarea>
    <select name ="pestel" required>
        <option value="">Pestel wählen</option>
        <option th:each="h : ${T(de.umfeldradar.thema.Pestel).values()}" th:value="${h}" th:text="${h}" th:selected="${h == thema.pestel}"></option>
    </select>
    <button type="submit">Bearbeiten</button>
</form>
</body>
</html>
